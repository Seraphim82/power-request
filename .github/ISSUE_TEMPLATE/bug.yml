name: Relatar um problema
description: Algo não funcionou como esperado
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Falha de **segurança**? Não use este formulário. Veja o arquivo SECURITY.md."
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: O que você fez, o que esperava e o que viu. Prints ajudam. Não cole chaves de API.
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Sistema e versões
      placeholder: "macOS 15, Python 3.12, Node 22, IA usada (ex.: Claude local)"
